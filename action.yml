name: imp mutation testing
description: Run go-imp using your .imp.yaml, with automatic branch-aware diff testing
branding:
  icon: target
  color: purple
inputs:
  version:
    description: Release version to download (latest, v0.8.0 or 0.8.0)
    default: latest
  args:
    description: Extra imp run arguments, one argument per line (no shell expansion)
    default: ''
  diff:
    description: 'Diff scope: auto, off, or an explicit Git ref'
    default: auto
runs:
  using: node24
  main: dist/index.mjs
