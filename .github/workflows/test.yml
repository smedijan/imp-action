name: Test action
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: git diff --exit-code -- dist
      - name: Create smoke-test module
        shell: bash
        run: |
          mkdir -p smoke
          cd smoke
          go mod init example.com/smoke
          printf 'package smoke\nfunc Add(a, b int) int { return a + b }\n' > smoke.go
          printf 'package smoke\nimport "testing"\nfunc TestAdd(t *testing.T) { if Add(1, 2) != 3 { t.Fatal("wrong sum") } }\n' > smoke_test.go
          printf 'run:\n  dry-run: true\n' > .imp.yaml
      - uses: ./
        with:
          version: v0.8.0
          diff: off
          args: |
            --config=smoke/.imp.yaml
            smoke
      - uses: ./
        with:
          args: |
            --config=smoke/.imp.yaml
            smoke
